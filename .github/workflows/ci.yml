name: CI Checks

on:
  pull_request:
    branches: [main]
    # No `edited`: a title/body/base tweak has nothing for this suite to re-run,
    # and a run that skips all of its jobs would still publish a "skipped"
    # conclusion over the real one for every required check.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ubuntu-latest runners have 4 vCPUs. turbo's default concurrency (10) oversubscribes
  # the box once every package runs together, and CPU-starved event-loop scheduling was
  # blowing packages/ai's agent-loop test past its own 30s timeout on the old runners.
  TURBO_CONCURRENCY: 4
  # Two directories never reached this repository: `packages/ai/evals/` (what
  # `@autonoma/ai/evaluation` resolves to) and `apps/cli/src/ui/fixtures`. Everything that
  # imports them cannot typecheck or run here: the @autonoma/evals package, the planner's UI
  # and replay tests, and the worker-diffs eval corpus. Those three packages are taken out of
  # the turbo typecheck/test tasks below; worker-diffs, which ships as an image, is then
  # checked and tested on its own with the eval corpus left out, so a failure there is still
  # a red check. Drop this once the two directories exist.
  EVAL_FREE_FILTERS: --filter='!@autonoma/evals' --filter='!@autonoma-ai/planner' --filter='!@autonoma/worker-diffs'

jobs:
  changes:
    name: Detect changes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      db: ${{ steps.filter.outputs.db }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # This workflow and the composite action are in the filter on purpose: a change
            # to either can break the job, and the narrow filter would otherwise let a
            # workflow-only change skip it. A job you cannot exercise from a PR that edits
            # it is a job that breaks on someone else's unrelated commit.
            db:
              - 'packages/db/prisma/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  check-migrations:
    name: Check Prisma Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.db == 'true'
    services:
      shadow-db:
        image: postgres:18
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Check for pending migrations
        env:
          DATABASE_URL: "postgresql://prisma:prisma@localhost:5432/shadow"
        run: |
          SHADOW_URL="postgresql://prisma:prisma@localhost:5432/shadow"
          cat > packages/db/prisma.config.ts <<EOF
          import { defineConfig } from "prisma/config";
          export default defineConfig({
            schema: "prisma/schema.prisma",
            migrations: { path: "prisma/migrations" },
            datasource: { url: "${SHADOW_URL}", shadowDatabaseUrl: "${SHADOW_URL}" },
          });
          EOF
          diff_output=$(pnpm -F @autonoma/db db migrate diff --from-migrations ./prisma/migrations --to-schema ./prisma/schema.prisma --exit-code 2>&1) || exit_code=$?
          if [ "${exit_code:-0}" -eq 2 ]; then
            echo "::error::Prisma schema has changes not covered by a migration. Run 'pnpm db:migrate' to create one."
            echo "$diff_output"
            exit 1
          fi

  # No kind job. The upstream `k8s-integration` job (a real kind cluster for @autonoma/k8s)
  # was tried on ubuntu-latest: the cluster came up and the suite ran to completion, but
  # `preview-fleet.integration.test.ts` timed out waiting for a crash-looping pod to be
  # classified `error` (202s on a 4-vCPU hosted runner), so it is dropped rather than left
  # red. `pnpm --filter @autonoma/k8s test:integration` still runs it locally with kind.

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and install
        uses: ./.github/actions/setup-pnpm

      # Per-job key (jobs run in parallel and must not clobber each other's
      # cache entry); the sha suffix makes each commit save a fresh immutable
      # entry, and the prefix restore-keys pulls the newest prior one so a PR's
      # later commits only recompute the packages that actually changed.
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-

      - name: Lint
        run: pnpm turbo run lint --continue --concurrency=${{ env.TURBO_CONCURRENCY }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Set up pnpm and install
        uses: ./.github/actions/setup-pnpm

      # --with-deps: a GitHub-hosted runner has no Chromium system libraries preinstalled.
      - name: Install Playwright browsers
        run: pnpm --filter @autonoma/engine-web exec playwright install --with-deps chromium

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-

      - name: Test
        # No API keys here on purpose: `pnpm test` runs only deterministic, key-free unit tests. The
        # live-model tests (real, paid, non-deterministic calls) are excluded from every package's
        # default `test` script and run on demand via `pnpm eval`.
        run: pnpm turbo run test --continue --concurrency=${{ env.TURBO_CONCURRENCY }} ${{ env.EVAL_FREE_FILTERS }}

      # See EVAL_FREE_FILTERS: the worker's own tests, minus the two suites that read the eval corpus.
      - name: Test worker-diffs
        working-directory: apps/workers/diffs
        env:
          TESTING: "true"
        run: pnpm exec vitest run --exclude '**/eval-corpus.test.ts' --exclude '**/eval-graders.test.ts'

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and install
        uses: ./.github/actions/setup-pnpm

      # No turbo cache step: test:integration is `"cache": false` in turbo.json, so there is
      # nothing to restore and a green run never lets a later commit skip the suite.
      #
      # Docker ships with ubuntu-latest; each suite brings its own containers up and down.
      # @autonoma/k8s is excluded because it needs a kind cluster (see the note above).
      #
      # One PACKAGE at a time (`--concurrency=1`), because they contend for Docker. Within a
      # package, test files run in parallel wherever each suite owns its own database.
      - name: Integration test
        run: pnpm turbo run test:integration --continue --concurrency=1 --filter='!@autonoma/k8s'

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-

      - name: Build
        run: pnpm turbo run build --filter "./apps/*" --filter "./apps/jobs/*" --filter "./apps/workers/*" --concurrency=${{ env.TURBO_CONCURRENCY }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-

      - name: Typecheck
        run: pnpm turbo run typecheck --continue --concurrency=${{ env.TURBO_CONCURRENCY }} ${{ env.EVAL_FREE_FILTERS }}

      # See EVAL_FREE_FILTERS: the worker's runtime sources only (its `typecheck` script also
      # checks tsconfig.eval.json, which reaches the eval corpus).
      - name: Typecheck worker-diffs
        working-directory: apps/workers/diffs
        run: pnpm exec tsc --noEmit
