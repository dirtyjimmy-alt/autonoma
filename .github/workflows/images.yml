name: Images

# Container images for the deployable services, built from the repository root so every image is
# self-contained (see each Dockerfile). On a pull request the images are built and discarded, which
# is what proves the Dockerfiles; on main (and on demand) they are pushed to GHCR as
# ghcr.io/<owner>/autonoma-<name>:sha-<12 chars>, and the bump job hands the pinned tag@digest
# references to infra-gitops: a pull request there, merged by this workflow once its checks pass.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/autonoma
  # Baked into the UI bundle: the API's public origin and the parent domain of the session cookie.
  UI_API_URL: https://autonoma-api.shs.cx
  UI_INTERNAL_DOMAIN: shs.cx

jobs:
  build:
    name: ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: ui
            dockerfile: apps/ui/Dockerfile
          - name: worker-web
            dockerfile: apps/workers/web/Dockerfile
          - name: worker-general
            dockerfile: apps/workers/general/Dockerfile
          - name: worker-diffs
            dockerfile: apps/workers/diffs/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each image carries the monorepo's node_modules (about 2 GB) and the builder stage holds a
      # second copy; the toolchains ubuntu-latest preinstalls and this build never touches are
      # removed first so the job does not run out of disk mid-copy.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image.name }}:${{ steps.meta.outputs.tag }}
          # Only the UI Dockerfile declares these; the others ignore them with a warning.
          build-args: |
            VITE_API_URL=${{ env.UI_API_URL }}
            VITE_INTERNAL_DOMAIN=${{ env.UI_INTERNAL_DOMAIN }}
          # A plain single-platform manifest, so the digest below is the one a `tag@digest` pin
          # addresses - with provenance on, buildx pushes an index that wraps an attestation too.
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record the pushed reference
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p refs
          echo "${IMAGE_PREFIX}-${{ matrix.image.name }}:${{ steps.meta.outputs.tag }}@${{ steps.build.outputs.digest }}" | tee "refs/${{ matrix.image.name }}"

      - name: Upload the reference
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-ref-${{ matrix.image.name }}
          path: refs/
          retention-days: 7

      # GitHub has no API that changes a package's visibility, so this only reports. A package
      # that is still private after the first push is made public once, by hand:
      # github.com/users/<owner>/packages/container/autonoma-<name>/settings -> Danger Zone ->
      # Change visibility -> Public. The cluster pulls anonymously, so it stays a notice until then.
      - name: Report package visibility
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility=$(gh api "/users/${{ github.repository_owner }}/packages/container/autonoma-${{ matrix.image.name }}" --jq .visibility 2>/dev/null || echo "unknown")
          echo "package autonoma-${{ matrix.image.name }} visibility: ${visibility}"
          if [ "$visibility" != "public" ]; then
            echo "::notice title=GHCR package not public::autonoma-${{ matrix.image.name }} is '${visibility}'. Make it public once in the package settings (Danger Zone -> Change visibility) so the cluster can pull it without credentials."
          fi

  # Delivers the pushed references to infra-gitops and merges them itself. That repository has
  # auto-merge disabled and, on its plan, no branch protection, so nothing on GitHub's side merges
  # for us: this job opens the pull request, waits for every check run on it and squash-merges it
  # when all of them succeeded. Otherwise the pull request stays open and the job fails.
  #
  # The GitHub App behind INFRA_GITOPS_BUMP_APP_ID / INFRA_GITOPS_BUMP_APP_PRIVATE_KEY is installed
  # on infra-gitops with these repository permissions, and no others:
  #   Contents: read and write       push the autonoma-images/* branch, merge the pull request
  #   Pull requests: read and write  open, comment on, close and merge pull requests
  #   Checks: read                   the check runs `gh pr checks` waits for
  #   Commit statuses: read          the commit statuses `gh pr checks` waits for
  #   Metadata: read                 granted to every installation
  # The App token is not GITHUB_TOKEN, so infra-gitops workflows run on its pull requests as on
  # anyone else's.
  #
  # Ordering: only the commit at the head of main bumps; a run for an older commit leaves the bump
  # to the newer commit's run. One bump runs at a time and a newer one cancels an older one still in
  # flight; every open autonoma-images/* pull request for another commit is then closed as
  # superseded (commented, not deleted). A rerun for the same commit reuses its branch and pull
  # request when they already hold the same content. Merged head branches are left in place; the
  # infra-gitops setting "Automatically delete head branches" is the place to change that.
  bump:
    name: Bump infra-gitops
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: infra-gitops-bump
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      # The `secrets` context is not available in a job-level `if`, so the gate is a step.
      BUMP_APP_ID: ${{ secrets.INFRA_GITOPS_BUMP_APP_ID }}
      BUMP_APP_PRIVATE_KEY: ${{ secrets.INFRA_GITOPS_BUMP_APP_PRIVATE_KEY }}
      GITOPS_REPOSITORY: infra-gitops
      GITOPS: ${{ github.repository_owner }}/infra-gitops
      GITOPS_COMPONENT_DIR: components/autonoma
      BRANCH_PREFIX: autonoma-images/
      # How long the pull request's checks may take before it is left open and the job fails.
      CHECKS_TIMEOUT_MINUTES: 30
      # How long the first check run may take to appear on a fresh pull request.
      CHECKS_APPEAR_TIMEOUT_SECONDS: 180
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check the bump credentials and that this commit heads main
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          short="${GITHUB_SHA::12}"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH_PREFIX}${short}" >> "$GITHUB_OUTPUT"
          if [ -z "$BUMP_APP_ID" ] || [ -z "$BUMP_APP_PRIVATE_KEY" ]; then
            echo "::notice title=infra-gitops bump skipped::Repository secrets INFRA_GITOPS_BUMP_APP_ID and INFRA_GITOPS_BUMP_APP_PRIVATE_KEY are not set. The images were pushed; infra-gitops keeps its current references until the secrets exist."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice title=infra-gitops bump skipped::${short} is not the head of main (${head::12} is). The images were pushed; the run for the head of main delivers the references."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: autonoma
          sparse-checkout: scripts

      - name: Download the image references
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-ref-*
          merge-multiple: true
          path: refs

      - name: Mint the GitHub App token
        if: steps.gate.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ env.BUMP_APP_ID }}
          private-key: ${{ env.BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.GITOPS_REPOSITORY }}

      - name: Checkout infra-gitops
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITOPS }}
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Rewrite the image references
        if: steps.gate.outputs.enabled == 'true'
        id: rewrite
        run: |
          if [ ! -d "gitops/${GITOPS_COMPONENT_DIR}" ]; then
            echo "::notice title=infra-gitops bump skipped::${GITOPS_REPOSITORY} has no ${GITOPS_COMPONENT_DIR}/ yet; nothing to rewrite."
            echo "component=false" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "component=true" >> "$GITHUB_OUTPUT"
          node autonoma/scripts/bump-gitops-images.mjs "gitops/${GITOPS_COMPONENT_DIR}" refs/* | tee rewrite.log
          if grep -q '^changed: 0$' rewrite.log; then
            echo "::notice title=infra-gitops already current::Every reference under ${GITOPS_COMPONENT_DIR}/ already points at these images."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Every open autonoma-images/* pull request for another autonoma commit is older than this one
      # (only the head of main gets here), so it is closed with a comment; its branch stays. This runs
      # even when nothing changed, because a stale pull request is stale either way.
      - name: Close superseded pull requests
        if: steps.rewrite.outputs.component == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWN_PREFIX: ${{ steps.gate.outputs.branch }}
          SHORT: ${{ steps.gate.outputs.short }}
        run: |
          gh pr list -R "$GITOPS" --state open --limit 100 --json number,headRefName --jq '.[] | "\(.number) \(.headRefName)"' \
          | while read -r number head; do
              case "$head" in
                "${OWN_PREFIX}"*) continue ;;
                "${BRANCH_PREFIX}"*) ;;
                *) continue ;;
              esac
              echo "closing ${GITOPS}#${number} (${head}): superseded by ${SHORT}"
              gh pr comment "$number" -R "$GITOPS" --body "Superseded by autonoma commit ${SHORT} (${SOURCE_URL}), delivered by ${RUN_URL}. Closing this pull request; its branch is left in place."
              gh pr close "$number" -R "$GITOPS"
            done

      # The branch is named after the autonoma commit. When a previous attempt already pushed it with
      # the same component content, that branch (and its open pull request, if any) is reused; when
      # its content differs (infra-gitops main moved underneath), a branch suffixed with the run id
      # and attempt is pushed instead, so no branch is ever force-pushed.
      - name: Publish the branch and the pull request
        if: steps.rewrite.outputs.changed == 'true'
        id: publish
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          SHORT: ${{ steps.gate.outputs.short }}
          BRANCH: ${{ steps.gate.outputs.branch }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "${GITOPS_COMPONENT_DIR}"
          {
            echo "Source: ${SOURCE_URL}"
            echo "Build: ${RUN_URL}"
            echo
            cat ../refs/*
          } > ../commit-body.txt
          git commit -m "autonoma: images ${SHORT}" -F ../commit-body.txt
          branch="$BRANCH"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch --depth=1 origin "refs/heads/${branch}"
            if git diff --quiet FETCH_HEAD HEAD -- "$GITOPS_COMPONENT_DIR"; then
              echo "${branch} already holds these references; reusing it"
            else
              branch="${BRANCH}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              echo "${BRANCH} exists with different content; publishing ${branch} instead"
              git push origin "HEAD:refs/heads/${branch}"
            fi
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          number=$(gh pr list -R "$GITOPS" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            echo "reusing the open pull request ${GITOPS}#${number} for ${branch}"
          else
            {
              echo "Pinned image references for autonoma commit ${SHORT} (${SOURCE_URL})."
              echo
              echo '```'
              cat ../refs/*
              echo '```'
              echo
              echo "Built by ${RUN_URL}, which merges this pull request once every check on it succeeds."
            } > ../pr-body.md
            url=$(gh pr create -R "$GITOPS" --title "autonoma: images ${SHORT}" --body-file ../pr-body.md --head "$branch" --base main)
            number="${url##*/}"
            echo "opened ${url}"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      # `gh pr checks --watch` returns once every check run reported so far has finished; the loop
      # around it waits for the first one to appear and catches a check that registered late, so a
      # pull request is never merged while something on it is still pending. Only `pass` counts: a
      # skipped or cancelled check is not a success and leaves the pull request open.
      - name: Wait for the pull request checks
        if: steps.publish.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.publish.outputs.number }}
          PR_URL: ${{ github.server_url }}/${{ env.GITOPS }}/pull/${{ steps.publish.outputs.number }}
        run: |
          started=$(date +%s)
          deadline=$(( started + CHECKS_TIMEOUT_MINUTES * 60 ))
          while :; do
            gh pr checks "$PR" -R "$GITOPS" --json name,bucket,state,link > checks.json 2>/dev/null || echo '[]' > checks.json
            total=$(jq length checks.json)
            pending=$(jq '[.[] | select(.bucket == "pending")] | length' checks.json)
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              break
            fi
            now=$(date +%s)
            if [ "$total" -eq 0 ] && [ $(( now - started )) -ge "$CHECKS_APPEAR_TIMEOUT_SECONDS" ]; then
              echo "::error title=infra-gitops bump not merged::No check run appeared on ${GITOPS}#${PR} within ${CHECKS_APPEAR_TIMEOUT_SECONDS}s. The pull request stays open: ${PR_URL}"
              exit 1
            fi
            if [ "$now" -ge "$deadline" ]; then
              jq -r '.[] | "\(.bucket)\t\(.state)\t\(.name)\t\(.link)"' checks.json
              echo "::error title=infra-gitops bump not merged::Checks on ${GITOPS}#${PR} did not finish within ${CHECKS_TIMEOUT_MINUTES} minutes. The pull request stays open: ${PR_URL}"
              exit 1
            fi
            if [ "$total" -eq 0 ]; then
              sleep 10
            else
              timeout $(( deadline - now )) gh pr checks "$PR" -R "$GITOPS" --watch --interval 30 || echo "gh pr checks --watch exited with $?"
              sleep 10
            fi
          done
          jq -r '.[] | "\(.bucket)\t\(.state)\t\(.name)\t\(.link)"' checks.json
          not_passed=$(jq '[.[] | select(.bucket != "pass")] | length' checks.json)
          if [ "$not_passed" -ne 0 ]; then
            echo "::error title=infra-gitops bump not merged::${not_passed} of ${total} checks on ${GITOPS}#${PR} did not succeed (listed above). The pull request stays open for a human: ${PR_URL}"
            exit 1
          fi
          echo "all ${total} checks on ${GITOPS}#${PR} succeeded"

      - name: Merge the pull request
        if: steps.publish.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.publish.outputs.number }}
          PR_URL: ${{ github.server_url }}/${{ env.GITOPS }}/pull/${{ steps.publish.outputs.number }}
          SHORT: ${{ steps.gate.outputs.short }}
        run: |
          if ! gh pr merge "$PR" -R "$GITOPS" --squash --subject "autonoma: images ${SHORT}" --body-file commit-body.txt; then
            echo "::error title=infra-gitops bump not merged::GitHub refused to merge ${GITOPS}#${PR}; see the output above. The pull request stays open: ${PR_URL}"
            exit 1
          fi
          echo "::notice title=infra-gitops bumped::Merged ${GITOPS}#${PR}: autonoma ${SHORT} is on infra-gitops main."
