name: Set up pnpm and install
description: >-
  pnpm at the version `packageManager` pins, Node from .nvmrc with the pnpm store cached between runs,
  then a frozen install. One place to change when the toolchain moves.

runs:
  using: composite
  steps:
    # No `version`: pnpm/action-setup reads `packageManager` from package.json, so the runner and a
    # developer's corepack always agree on the pnpm release.
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
